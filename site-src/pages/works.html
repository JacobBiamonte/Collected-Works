<section class="page-intro shell">
  <p class="eyebrow">Source papers</p>
  <h1>Works</h1>
  <p class="lede">The papers, preprints and chapters included in the collection, with their authors, publication details and links to the original sources.</p>
</section>
<section class="shell index-section" data-filter-root>
  <div class="filter-bar">
    <label class="search-field">
      <span>Search works</span>
      <input type="search" placeholder="Title, author, identifier or topic" data-search-input>
    </label>
    <label>
      <span>Volume</span>
      <select data-volume-filter>
        <option value="">All volumes</option>
        <option value="I">Volume I</option>
        <option value="II">Volume II</option>
        <option value="III">Volume III</option>
      </select>
    </label>
    <label>
      <span>Evidence</span>
      <select data-status-filter>
        <option value="">All evidence states</option>
        <option value="source-aligned">Source aligned</option>
        <option value="analytically-checked">Analytically checked</option>
        <option value="reproduced">Reproduced</option>
        <option value="formally-verified">Formally verified</option>
      </select>
    </label>
  </div>
  <div class="index-summary" aria-live="polite"><span data-visible-count>{{WORK_COUNT}}</span> works included</div>
  <div class="card-list" data-filter-list>
    {{WORK_CARDS}}
  </div>
  {{WORK_EMPTY_STATE}}
</section>
