<section class="page-intro shell">
  <p class="eyebrow">Result index</p>
  <h1>Results</h1>
  <p class="lede">The mathematical results included in the collection, with their statements, assumptions, original sources and progress toward formalization in Lean.</p>
</section>
<section class="shell index-section" data-filter-root>
  <div class="filter-bar two-up">
    <label class="search-field">
      <span>Search results</span>
      <input type="search" placeholder="Statement, identifier, work or chapter" data-search-input>
    </label>
    <label>
      <span>Volume</span>
      <select data-volume-filter>
        <option value="">All volumes</option>
        <option value="I">Volume I</option>
        <option value="II">Volume II</option>
        <option value="III">Volume III</option>
      </select>
    </label>
  </div>
  <div class="index-summary" aria-live="polite"><span data-visible-count>{{RESULT_COUNT}}</span> results indexed</div>
  <div class="card-list" data-filter-list>
    {{RESULT_CARDS}}
  </div>
  {{RESULT_EMPTY_STATE}}
</section>
